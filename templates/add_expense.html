{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expense.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add expense</h1>
            <p class="auth-subtitle">Record something you spent</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}" class="expense-form">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="250.50"
                           step="0.01" min="0.01" inputmode="decimal"
                           value="{{ amount or '' }}"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category"
                            class="form-input expense-select" required>
                        <option value="">Choose a category</option>
                        {% for name in categories %}
                        <option value="{{ name }}"{% if name == category %} selected{% endif %}>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           max="{{ today }}"
                           value="{{ date or '' }}"
                           required>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="Lunch with friends"
                           maxlength="200"
                           value="{{ description or '' }}">
                </div>
                <button type="submit" class="btn-submit">Save expense</button>
            </form>

            <a href="{{ url_for('profile') }}" class="expense-cancel">Cancel</a>
        </div>

    </div>
</section>

{% endblock %}
